[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "llm-cost"
version = "0.1.0"
description = "Estimate LLM token counts and API cost per provider and model, from the CLI or Python"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "GuiDobelin" }]
keywords = ["llm", "tokens", "cost", "pricing", "anthropic", "claude", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
llm-cost = "llm_cost.cli:main"

[project.urls]
Homepage = "https://github.com/GuiDobelin/llm-cost"
Issues = "https://github.com/GuiDobelin/llm-cost/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_cost"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
